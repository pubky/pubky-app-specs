<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Pubky Social Specs Demo</title>
  </head>
  <body>
    <script type="module">
      // Serve this directory after a build, for example: python3 -m http.server 8000
      import { init, createUser, createPost, createFollow } from "./index.js";

      const OTTO = "8kkppkmiubfq4pxn6f73nqrhhhgkb5xyfprntc9si3np9ydbotto";
      const RIO = "dzswkfy7ek3bqnoc89jxuqqfbzhjrj6mi8qthgbxxcqkdugm3rio";

      try {
        await init();

        const user = createUser(OTTO, { name: "Alice Smith", bio: "Software Developer", status: "active" });
        console.log("User created:", user.meta.url, user.object);

        const post = createPost(OTTO, { content: "Hello from browser!" });
        console.log("Post created:", post.meta.url, post.object);

        const follow = createFollow(OTTO, RIO);
        console.log("Follow created:", follow.meta.url);

        console.log("All tests passed!");
      } catch (err) {
        console.error("Error:", err);
      }
    </script>
  </body>
</html>
