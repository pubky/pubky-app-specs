name: JS Binding Tests

on:
  push:
    branches: [ main, v1 ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "wasm32-unknown-unknown"

    - name: Install wasm-pack
      run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.13.0'

    - name: Install package dev dependencies
      run: |
        # The build compiles the migration engine with the package's own tsc
        cd ./pkg
        npm install

    - name: Build WASM package
      run: |
        cd ./pkg
        npm run build

    - name: Build left the tracked package files untouched
      run: |
        if [ -n "$(git status --porcelain pkg/)" ]; then
          git status --short pkg/
          exit 1
        fi

    - name: Run JS tests
      run: |        
        cd ./pkg
        echo "Running JavaScript tests..."
        npm run test
        
        echo "All tests completed successfully!"

    - name: Verify npm package contents
      run: |
        cd ./pkg
        npm pack --dry-run .